<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Tauri!</title>
    <style>
      :root {
        --text-color: #000000;
        --background-color: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text-color: #ffffff;
          --background-color: #000000;
        }
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        color: var(--text-color);
        background: repeating-linear-gradient(
          45deg,
          #ff00ff,
          #ff00ff 20px,
          #00ffff 20px,
          #00ffff 40px
        );
        margin: 0;
        padding: 2rem;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      #sizecheck {
        position: fixed;
        inset: 0;
        border: 10px solid lime;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="sizecheck"></div>
    <h1 id="dims" style="background: black; display: inline-block; padding: 0.5rem;"></h1>
    <script>
      const dimsEl = document.getElementById('dims')
      const update = () => { dimsEl.textContent = `${window.innerWidth} x ${window.innerHeight}` }
      update()
      window.addEventListener('resize', update)
    </script>
    <h1>Welcome to Tauri!</h1>

    <form id="form">
      <input id="name" placeholder="Enter a name..." />
      <button>Greet</button>
    </form>

    <p id="message"></p>

    <script>
      const { invoke } = window.__TAURI__.core

      const form = document.querySelector('#form')
      const nameEl = document.querySelector('#name')
      const messageEl = document.querySelector('#message')

      form.addEventListener('submit', async (e) => {
        e.preventDefault()

        const name = nameEl.value
        const newMessage = await invoke('greet', { name })
        messageEl.textContent = newMessage
      })
    </script>
  </body>
</html>
